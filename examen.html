<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Examen Piloto de Planeador</title>
<style>
:root {
  --bg:#0f172a; --panel:#111827; --panel2:#1f2937; --text:#f8fafc; --muted:#94a3b8;
  --line:#334155; --accent:#38bdf8; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b1120,#111827);color:var(--text);min-height:100vh}
.wrap{max-width:860px;margin:auto;padding:22px}
.card{background:rgba(17,24,39,.97);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
h1{font-size:clamp(26px,5vw,40px);margin:0 0 8px}
.sub{color:var(--muted);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
button{font:inherit;cursor:pointer}
.mode{padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-align:left}
.mode:hover{border-color:var(--accent)}
.mode strong{display:block;font-size:18px;margin-bottom:5px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;color:var(--muted)}
label{display:flex;align-items:center;gap:8px}
input[type=checkbox]{width:18px;height:18px}
.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:14px}
.progress{height:9px;background:#0b1220;border-radius:99px;overflow:hidden;margin:13px 0 24px}
.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.badge{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:#cbd5e1;font-size:12px;margin-bottom:12px}
.question{font-size:clamp(20px,4vw,28px);line-height:1.28;margin:0 0 20px}
.options{display:grid;gap:11px}
.opt{width:100%;padding:15px 16px;border-radius:13px;border:1px solid var(--line);background:#172033;color:var(--text);text-align:left;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt .letter{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#0f172a;font-weight:700}
.opt.correct{border-color:var(--ok);background:rgba(34,197,94,.13)}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.13)}
.opt:disabled{cursor:default}
.feedback{margin-top:18px;padding:14px;border-radius:12px;display:none}
.feedback.ok{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4)}
.feedback.bad{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4)}
.note{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);color:#fde68a;font-size:14px;line-height:1.4}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.primary,.secondary{padding:12px 18px;border-radius:12px;border:1px solid var(--line);color:white}
.primary{background:#0369a1;border-color:#0ea5e9}
.secondary{background:#1f2937}
.result{text-align:center}
.score{font-size:58px;font-weight:800;margin:16px 0 4px}
.review{margin-top:22px;text-align:left}
.reviewItem{padding:12px;border-bottom:1px solid var(--line)}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:520px){.wrap{padding:12px}.card{padding:16px;border-radius:14px}.actions{flex-direction:column-reverse}.actions button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div id="start" class="card">
    <h1>✈️ Examen Piloto de Planeador</h1>
    <div class="sub">Cuestionario de práctica basado en tus dos fuentes: 50 preguntas + Banco ANAC 2014 de 111 preguntas.</div>
    <div class="grid">
      <button class="mode" onclick="startQuiz('all')"><strong>Examen completo</strong>161 preguntas</button>
      <button class="mode" onclick="startQuiz('50')"><strong>Examen ANAC</strong>50 preguntas</button>
      <button class="mode" onclick="startQuiz('111')"><strong>Banco ANAC 2014</strong>111 preguntas</button>
    </div>
    <div class="controls">
      <label><input id="shuffle" type="checkbox"> Mezclar preguntas</label>
      <label><input id="study" type="checkbox" checked> Mostrar corrección al responder</label>
    </div>
    <p class="small">La aplicación funciona sin internet una vez cargada. El progreso del intento se mantiene en este navegador.</p>
  </div>

  <div id="quiz" class="card hidden">
    <div class="topbar"><span id="counter"></span><span id="scoreTop"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="badge" class="badge"></div>
    <h2 id="question" class="question"></h2>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>
    <div class="actions">
      <button class="secondary" onclick="quitQuiz()">Salir</button>
      <button id="nextBtn" class="primary hidden" onclick="nextQuestion()">Siguiente</button>
    </div>
  </div>

  <div id="result" class="card result hidden">
    <h1>Resultado</h1>
    <div id="finalScore" class="score"></div>
    <div id="finalText" class="sub"></div>
    <div class="actions" style="justify-content:center">
      <button class="secondary" onclick="location.reload()">Volver al inicio</button>
      <button class="primary" onclick="repeatWrong()">Repasar errores</button>
    </div>
    <div id="review" class="review"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"global": 1, "source": "Examen ANAC 50", "sourceNumber": 1, "q": "Siendo el planeador más pesado que el aire, ¿qué es necesario para que vuele?", "options": [{"k": "A", "t": "Una fuerza capaz de oponerse a su propio peso."}, {"k": "B", "t": "Una componente paralela al viento relativo."}, {"k": "C", "t": "Una corriente ascendente."}], "answer": "A", "note": ""}, {"global": 2, "source": "Examen ANAC 50", "sourceNumber": 2, "q": "¿Cuál es la principal función del ala?", "options": [{"k": "A", "t": "Disminuir la resistencia."}, {"k": "B", "t": "Generar sustentación."}, {"k": "C", "t": "Manejar el ángulo de ataque."}], "answer": "B", "note": ""}, {"global": 3, "source": "Examen ANAC 50", "sourceNumber": 3, "q": "El ángulo de ataque es:", "options": [{"k": "A", "t": "El ángulo entre el ala y el fuselaje."}, {"k": "B", "t": "El ángulo entre el viento relativo y la cuerda del ala."}, {"k": "C", "t": "El ángulo entre el ala y el elevador."}], "answer": "B", "note": ""}, {"global": 4, "source": "Examen ANAC 50", "sourceNumber": 4, "q": "A mayor ángulo de ataque:", "options": [{"k": "A", "t": "Mayor sustentación y menor resistencia."}, {"k": "B", "t": "Menor sustentación y menor resistencia."}, {"k": "C", "t": "Mayor sustentación y mayor resistencia."}], "answer": "C", "note": ""}, {"global": 5, "source": "Examen ANAC 50", "sourceNumber": 5, "q": "La función del timón de profundidad es:", "options": [{"k": "A", "t": "Controlar el ángulo de ataque."}, {"k": "B", "t": "Controlar la velocidad."}, {"k": "C", "t": "Ambas son correctas."}], "answer": "C", "note": ""}, {"global": 6, "source": "Examen ANAC 50", "sourceNumber": 6, "q": "La resultante aerodinámica surge de la relación entre:", "options": [{"k": "A", "t": "Sustentación y peso."}, {"k": "B", "t": "Sustentación y resistencia."}, {"k": "C", "t": "Tracción y resistencia."}], "answer": "B", "note": ""}, {"global": 7, "source": "Examen ANAC 50", "sourceNumber": 7, "q": "La función de los alerones es:", "options": [{"k": "A", "t": "Rotar el planeador a través del eje vertical."}, {"k": "B", "t": "Controlar la inclinación del ala."}, {"k": "C", "t": "Generar más sustentación."}], "answer": "B", "note": ""}, {"global": 8, "source": "Examen ANAC 50", "sourceNumber": 8, "q": "¿Qué hace que el planeador vire?", "options": [{"k": "A", "t": "La sustentación generada por el ala que ha sido inclinada."}, {"k": "B", "t": "Los alerones."}, {"k": "C", "t": "El timón de dirección."}], "answer": "A", "note": ""}, {"global": 9, "source": "Examen ANAC 50", "sourceNumber": 9, "q": "¿Cuál es la función del timón de dirección?", "options": [{"k": "A", "t": "Virar el planeador."}, {"k": "B", "t": "Controlar el ángulo de ataque."}, {"k": "C", "t": "Contrarrestar el efecto adverso de alerón."}], "answer": "C", "note": ""}, {"global": 10, "source": "Examen ANAC 50", "sourceNumber": 10, "q": "Cuanto más inclinado es un viraje, el factor de carga:", "options": [{"k": "A", "t": "Aumenta."}, {"k": "B", "t": "Disminuye."}, {"k": "C", "t": "Permanece igual."}], "answer": "A", "note": ""}, {"global": 11, "source": "Examen ANAC 50", "sourceNumber": 11, "q": "¿Cuál es la función de la lanita?", "options": [{"k": "A", "t": "Verificar la inclinación del viraje."}, {"k": "B", "t": "Mostrar que el planeador está volando coordinado."}, {"k": "C", "t": "Ninguna de las anteriores."}], "answer": "B", "note": ""}, {"global": 12, "source": "Examen ANAC 50", "sourceNumber": 12, "q": "El peso aparente del planeador es mayor al peso real durante un viraje:", "options": [{"k": "A", "t": "Por efecto de la fuerza centrífuga."}, {"k": "B", "t": "Por efecto de la fuerza centrípeta."}, {"k": "C", "t": "Ninguna de las anteriores."}], "answer": "A", "note": ""}, {"global": 13, "source": "Examen ANAC 50", "sourceNumber": 13, "q": "En vuelo recto, si la lanita está a la izquierda, ¿cómo debo centrarla?", "options": [{"k": "A", "t": "Aplicando pedal izquierdo."}, {"k": "B", "t": "Aplicando pedal derecho."}, {"k": "C", "t": "Aumentando el ángulo de ataque."}], "answer": "B", "note": ""}, {"global": 14, "source": "Examen ANAC 50", "sourceNumber": 14, "q": "Es más fácil entrar inadvertidamente en pérdida:", "options": [{"k": "A", "t": "En un viraje escarpado."}, {"k": "B", "t": "En un viraje suave."}], "answer": "B", "note": "Clave del examen fuente: B. Esta pregunta entra en conflicto con la explicación aerodinámica del Manual sobre aumento de factor de carga y velocidad de pérdida con mayor inclinación."}, {"global": 15, "source": "Examen ANAC 50", "sourceNumber": 15, "q": "¿Cuándo se produce una pérdida de sustentación?", "options": [{"k": "A", "t": "Cuando se exceden los 60° de inclinación."}, {"k": "B", "t": "Cuando se excede el ángulo de ataque crítico."}, {"k": "C", "t": "Ninguna es correcta."}], "answer": "B", "note": ""}, {"global": 16, "source": "Examen ANAC 50", "sourceNumber": 16, "q": "¿Cómo debemos parar la rotación en una pérdida en viraje?", "options": [{"k": "A", "t": "Con alerón contrario."}, {"k": "B", "t": "Con palanca atrás."}, {"k": "C", "t": "Con pedal contrario."}], "answer": "C", "note": ""}, {"global": 17, "source": "Examen ANAC 50", "sourceNumber": 17, "q": "Un excesivo aumento de peso en el planeador:", "options": [{"k": "A", "t": "Aumenta la carrera de despegue."}, {"k": "B", "t": "Reduce la capacidad de ascenso."}, {"k": "C", "t": "Reduce la capacidad de maniobra."}, {"k": "D", "t": "Aumenta la velocidad de pérdida."}, {"k": "E", "t": "Todas las anteriores."}], "answer": "E", "note": ""}, {"global": 18, "source": "Examen ANAC 50", "sourceNumber": 18, "q": "Un planeador con el CG muy atrás:", "options": [{"k": "A", "t": "Es muy estable y no influye en las condiciones de vuelo."}, {"k": "B", "t": "Es poco estable y difícil de recuperar de barrenas."}, {"k": "C", "t": "Ninguna es correcta."}], "answer": "B", "note": ""}, {"global": 19, "source": "Examen ANAC 50", "sourceNumber": 19, "q": "La elevación de nuestro aeródromo es de 60 mts. y decolamos con ajuste QFE. Si en el primer punto de viraje la elevación es de 200 mts. y el altímetro nos indica 1000 mts., ¿cuál será nuestra verdadera altura sobre el mismo?", "options": [{"k": "A", "t": "1040 mts."}, {"k": "B", "t": "800 mts."}, {"k": "C", "t": "860 mts."}], "answer": "C", "note": ""}, {"global": 20, "source": "Examen ANAC 50", "sourceNumber": 20, "q": "¿Para qué se usa el flap negativo?", "options": [{"k": "A", "t": "Para mejorar la performance a altas velocidades."}, {"k": "B", "t": "Para subir mejor en la térmica."}, {"k": "C", "t": "Para efectuar la aproximación con más seguridad."}], "answer": "A", "note": ""}, {"global": 21, "source": "Examen ANAC 50", "sourceNumber": 21, "q": "¿Cuál posición en el remolque debe ser considerada peligrosa?", "options": [{"k": "A", "t": "En el chorro de la hélice."}, {"k": "B", "t": "Muy alta."}, {"k": "C", "t": "Muy baja."}], "answer": "B", "note": ""}, {"global": 22, "source": "Examen ANAC 50", "sourceNumber": 22, "q": "¿Qué debemos hacer si durante el remolque el piloto remolcador nos hace seña de corte?", "options": [{"k": "A", "t": "Preguntar por la radio si tiene algún problema."}, {"k": "B", "t": "Cortar inmediatamente."}, {"k": "C", "t": "Observar si estamos en lugar adecuado y luego cortar."}], "answer": "B", "note": ""}, {"global": 23, "source": "Examen ANAC 50", "sourceNumber": 23, "q": "Un variómetro de energía total:", "options": [{"k": "A", "t": "No refleja la acción del piloto sobre el elevador."}, {"k": "B", "t": "Sí refleja la acción del piloto sobre el elevador."}, {"k": "C", "t": "Ninguna es correcta."}], "answer": "A", "note": ""}, {"global": 24, "source": "Examen ANAC 50", "sourceNumber": 24, "q": "El velocímetro debe ir conectado a:", "options": [{"k": "A", "t": "Termo y toma estática."}, {"k": "B", "t": "Pitot y toma estática."}, {"k": "C", "t": "Ninguna es correcta."}], "answer": "B", "note": ""}, {"global": 25, "source": "Examen ANAC 50", "sourceNumber": 25, "q": "El uso de flaps positivo está asociado a:", "options": [{"k": "A", "t": "Planeo entre térmicas."}, {"k": "B", "t": "Vuelo a altas velocidades."}, {"k": "C", "t": "Vuelo a bajas velocidades."}], "answer": "C", "note": ""}, {"global": 26, "source": "Examen ANAC 50", "sourceNumber": 26, "q": "Si durante el remolque perdemos de vista el avión, debemos:", "options": [{"k": "A", "t": "Descender y ver si lo encontramos."}, {"k": "B", "t": "Cortar inmediatamente."}, {"k": "C", "t": "Preguntarle por radio al remolcador si él nos ve."}], "answer": "B", "note": ""}, {"global": 27, "source": "Examen ANAC 50", "sourceNumber": 27, "q": "Salvo indicación en contrario, todos los virajes en circuito de aeródromo deben ser:", "options": [{"k": "A", "t": "Por izquierda."}, {"k": "B", "t": "Por derecha."}, {"k": "C", "t": "Es indistinto."}, {"k": "D", "t": "Depende del viento."}], "answer": "A", "note": ""}, {"global": 28, "source": "Examen ANAC 50", "sourceNumber": 28, "q": "La principal función de los frenos aerodinámicos es:", "options": [{"k": "A", "t": "Incrementar la sustentación."}, {"k": "B", "t": "Incrementar la resistencia."}, {"k": "C", "t": "Ninguna de las anteriores."}], "answer": "B", "note": ""}, {"global": 29, "source": "Examen ANAC 50", "sourceNumber": 29, "q": "¿Qué clase de espacios aéreos hay en la Argentina?", "options": [{"k": "A", "t": "Clase A, B y C."}, {"k": "B", "t": "Clase A, B, C y D."}, {"k": "C", "t": "Clase A, B, C, D, F y G."}], "answer": "C", "note": ""}, {"global": 30, "source": "Examen ANAC 50", "sourceNumber": 30, "q": "¿Qué áreas de control se encuentran en el espacio aéreo “C”?", "options": [{"k": "A", "t": "Aeródromos controlados."}, {"k": "B", "t": "TMA y CTR."}, {"k": "C", "t": "TMA, CTR y ATZ."}], "answer": "C", "note": ""}, {"global": 31, "source": "Examen ANAC 50", "sourceNumber": 31, "q": "¿Qué licencia es requerida para operar una aeronave en espacio aéreo “A”?", "options": [{"k": "A", "t": "Cualquier licencia con la habilitación HVI."}, {"k": "B", "t": "Piloto Privado."}, {"k": "C", "t": "Piloto Comercial con la habilitación HVI."}], "answer": "A", "note": ""}, {"global": 32, "source": "Examen ANAC 50", "sourceNumber": 32, "q": "¿Cómo se denomina al área de control de aeródromo?", "options": [{"k": "A", "t": "TMA"}, {"k": "B", "t": "ATZ"}, {"k": "C", "t": "CTR"}], "answer": "C", "note": ""}, {"global": 33, "source": "Examen ANAC 50", "sourceNumber": 33, "q": "¿Cuál es la presión atmosférica estándar?", "options": [{"k": "A", "t": "1013 hPa."}, {"k": "B", "t": "29,92 hPa."}, {"k": "C", "t": "1013,25 hPa."}], "answer": "C", "note": ""}, {"global": 34, "source": "Examen ANAC 50", "sourceNumber": 34, "q": "¿Qué acción debe realizar el piloto que despega desde un AD no controlado antes de entrar en espacio aéreo “C”?", "options": [{"k": "A", "t": "Debe contactarse con el ATC antes de ingresar."}, {"k": "B", "t": "Debe presentar plan de vuelo antes de la partida."}, {"k": "C", "t": "Debe estar a la escucha del ATC antes de ingresar."}], "answer": "A", "note": ""}, {"global": 35, "source": "Examen ANAC 50", "sourceNumber": 35, "q": "La responsabilidad de evitar una colisión bajo reglas VFR es de:", "options": [{"k": "A", "t": "El control de área correspondiente."}, {"k": "B", "t": "El control y el piloto."}, {"k": "C", "t": "El piloto."}], "answer": "C", "note": ""}, {"global": 36, "source": "Examen ANAC 50", "sourceNumber": 36, "q": "Con falla de radio en un VFR controlado. ¿Cómo se aterriza en un AD controlado?", "options": [{"k": "A", "t": "Realizar la “Básica” alabeando los planos."}, {"k": "B", "t": "Bajar y subir el tren en vuelo circular sobre el aeródromo."}, {"k": "C", "t": "Efectuar alabeo en tramo “Inicial” y esperar señales luminosas de la TWR."}], "answer": "C", "note": ""}, {"global": 37, "source": "Examen ANAC 50", "sourceNumber": 37, "q": "Luego de aterrizar en un aeródromo controlado, ¿qué debe hacer el piloto?", "options": [{"k": "A", "t": "Completar los registros del avión."}, {"k": "B", "t": "Notificar el arribo."}, {"k": "C", "t": "Presentarse en la oficina ARO."}], "answer": "B", "note": ""}, {"global": 38, "source": "Examen ANAC 50", "sourceNumber": 38, "q": "En travesía se puede volar VFR sobre una capa de nubes que no cubra más de:", "options": [{"k": "A", "t": "3 octavos de la superficie terrestre."}, {"k": "B", "t": "4 octavos de la superficie terrestre."}, {"k": "C", "t": "5 octavos de la superficie terrestre."}], "answer": "B", "note": ""}, {"global": 39, "source": "Examen ANAC 50", "sourceNumber": 39, "q": "El nivel de transición es:", "options": [{"k": "A", "t": "El nivel de vuelo más bajo por encima de la altura de transición."}, {"k": "B", "t": "El nivel de vuelo más bajo por encima de la altitud de transición."}, {"k": "C", "t": "El nivel de vuelo equivalente a la transición corregido por presión estándar."}], "answer": "B", "note": ""}, {"global": 40, "source": "Examen ANAC 50", "sourceNumber": 40, "q": "En radiotelefonía, la palabra internacional de socorro es:", "options": [{"k": "A", "t": "WARNING"}, {"k": "B", "t": "S.O.S."}, {"k": "C", "t": "MAYDAY"}], "answer": "C", "note": ""}, {"global": 41, "source": "Examen ANAC 50", "sourceNumber": 41, "q": "Para deletrear palabras en radiotelefonía se utiliza:", "options": [{"k": "A", "t": "Código “Q”."}, {"k": "B", "t": "El alfabeto en uso legal del país."}, {"k": "C", "t": "El alfabeto aeronáutico internacional."}], "answer": "C", "note": ""}, {"global": 42, "source": "Examen ANAC 50", "sourceNumber": 42, "q": "Por lo general, la incorporación al circuito de tránsito se realiza:", "options": [{"k": "A", "t": "En Inicial."}, {"k": "B", "t": "En Básica."}, {"k": "C", "t": "En Inicial u Opuesto Paralelo, de acuerdo a la dirección de procedencia."}], "answer": "C", "note": ""}, {"global": 43, "source": "Examen ANAC 50", "sourceNumber": 43, "q": "Los mínimos meteorológicos VMC de un aeródromo controlado son:", "options": [{"k": "A", "t": "Visibilidad 8 km y techo 1000 ft."}, {"k": "B", "t": "Visibilidad 5 km y techo 1000 ft."}, {"k": "C", "t": "Visibilidad 2,5 km y techo 500 ft."}], "answer": "B", "note": ""}, {"global": 44, "source": "Examen ANAC 50", "sourceNumber": 44, "q": "Los niveles de vuelo están tomados con referencia a:", "options": [{"k": "A", "t": "Las alturas u obstáculos de un aeródromo."}, {"k": "B", "t": "La elevación del aeródromo."}, {"k": "C", "t": "La presión atmosférica estándar."}], "answer": "C", "note": ""}, {"global": 45, "source": "Examen ANAC 50", "sourceNumber": 45, "q": "Una X dibujada en la pista indica:", "options": [{"k": "A", "t": "Aterrice inmediatamente."}, {"k": "B", "t": "Aeródromo momentáneamente sin servicio ATS."}, {"k": "C", "t": "Pista cerrada."}], "answer": "C", "note": ""}, {"global": 46, "source": "Examen ANAC 50", "sourceNumber": 46, "q": "La señal visual de tierra de prohibido aterrizar se compone de:", "options": [{"k": "A", "t": "Un panel cuadrado rojo."}, {"k": "B", "t": "Un panel cuadrado negro con diagonales amarillas."}, {"k": "C", "t": "Un panel cuadrado rojo con diagonales amarillas."}], "answer": "C", "note": ""}, {"global": 47, "source": "Examen ANAC 50", "sourceNumber": 47, "q": "¿Cómo se obtiene el permiso para cambiar de vuelo VFR a VFR Controlado, con la dependencia ATS?", "options": [{"k": "A", "t": "Antes de ingresar al espacio aéreo controlado."}, {"k": "B", "t": "Hasta el momento del despegue, luego del cual NO se puede cambiar."}, {"k": "C", "t": "En el momento de ingresar a espacio aéreo controlado VFR/IFR."}], "answer": "A", "note": ""}, {"global": 48, "source": "Examen ANAC 50", "sourceNumber": 48, "q": "¿Qué tarea cumple la oficina AIS?", "options": [{"k": "A", "t": "Servicio de información aeronáutica previo al despegue."}, {"k": "B", "t": "Servicio de información meteorológica."}, {"k": "C", "t": "Servicio de información y reporte luego del aterrizaje."}], "answer": "A", "note": ""}, {"global": 49, "source": "Examen ANAC 50", "sourceNumber": 49, "q": "Al atravesar la “Capa de transición” en descenso, por norma general, la posición vertical se expresa en:", "options": [{"k": "A", "t": "Altitud."}, {"k": "B", "t": "Altura."}, {"k": "C", "t": "Nivel de vuelo."}], "answer": "A", "note": ""}, {"global": 50, "source": "Examen ANAC 50", "sourceNumber": 50, "q": "¿A partir de cuándo es obligatorio encender el transponder (si se dispone) en vuelo?", "options": [{"k": "A", "t": "De 3000 ft de altura en el modo disponible."}, {"k": "B", "t": "De 3000 ft de altura solo en “C”."}, {"k": "C", "t": "De 3000 ft de altitud en modo “A” o “C”."}], "answer": "C", "note": ""}, {"global": 51, "source": "Banco ANAC 2014", "sourceNumber": 1, "q": "¿ Cual es la visibilidad mínima para un vuelo VFR controlado?", "options": [{"k": "A", "t": "3 Km"}, {"k": "B", "t": "5 Km"}, {"k": "C", "t": "8 Km"}], "answer": "B", "note": ""}, {"global": 52, "source": "Banco ANAC 2014", "sourceNumber": 2, "q": "¿Cómo se corrige la velocidad en el tramo final del aterrizaje en los días de viento fuerte?", "options": [{"k": "A", "t": "Multiplico la velocidad del viento por dos y la sumo a la velocidad de aproximación."}, {"k": "B", "t": "Aumento la velocidad de tráfico en un 50 %."}, {"k": "C", "t": "Divido la velocidad del viento por dos y la sumo a la velocidad de aproximación."}], "answer": "C", "note": ""}, {"global": 53, "source": "Banco ANAC 2014", "sourceNumber": 3, "q": "¿Como se llama la ventanilla donde se lee y ajusta el valor de presión atmosférica?:", "options": [{"k": "A", "t": "Bernouilli."}, {"k": "B", "t": "Laplace"}, {"k": "C", "t": "Kolssman."}], "answer": "C", "note": ""}, {"global": 54, "source": "Banco ANAC 2014", "sourceNumber": 4, "q": "¿Cuál es la distancia mínima que se debe mantener entre el tramo inicial del circuito de aterrizaje y el eje de la pista?", "options": [{"k": "A", "t": "La distancia necesaria para poder accionar los frenos aerodinámicos en básica."}, {"k": "B", "t": "La distancia necesaria para poder efectuar los dos virajes (de inicial a básica y de básica a final) de 90 °."}, {"k": "C", "t": "La distancia necesaria para poder efectuar un viraje de 180 ° para poder comenzar la final."}], "answer": "C", "note": ""}, {"global": 55, "source": "Banco ANAC 2014", "sourceNumber": 5, "q": "¿Cuál es la velocidad que se debe utilizar como referencia para maniobrar una aeronave?:", "options": [{"k": "A", "t": "La velocidad sobre el terreno."}, {"k": "B", "t": "La velocidad verdadera."}, {"k": "C", "t": "La velocidad indicada"}], "answer": "C", "note": ""}, {"global": 56, "source": "Banco ANAC 2014", "sourceNumber": 6, "q": "¿Hasta qué altitud de presión máxima puede volarse en el espacio aéreo nacional sin oxígeno a presión al 100%, por más de 30 minutos? De acuerdo a RAAC 91.211", "options": [{"k": "A", "t": "3.962 m"}, {"k": "B", "t": "3.048 m"}, {"k": "C", "t": "10.000"}], "answer": "B", "note": ""}, {"global": 57, "source": "Banco ANAC 2014", "sourceNumber": 7, "q": "¿La palanca o bastón de mandos actúa sobre los tres ejes de rotación del planeador?", "options": [{"k": "A", "t": "Verdadero"}, {"k": "B", "t": "Falso"}], "answer": "B", "note": ""}, {"global": 58, "source": "Banco ANAC 2014", "sourceNumber": 8, "q": "¿Para qué se practican pérdidas de sustentación?", "options": [{"k": "A", "t": "Para aprender una maniobra acrobática."}, {"k": "B", "t": "Para comprobación de los comandos del planeador."}, {"k": "C", "t": "Para aprender a evitarlas o recuperarlas si han ocurrido inadvertidamente."}], "answer": "C", "note": ""}, {"global": 59, "source": "Banco ANAC 2014", "sourceNumber": 9, "q": "¿Para qué utiliza los frenos aerodinámicos?", "options": [{"k": "A", "t": "Para corregir un exceso de velocidad."}, {"k": "B", "t": "Para corregir un exceso de altura en circuito de aterrizaje."}, {"k": "C", "t": "a y b son correctas."}], "answer": "C", "note": ""}, {"global": 60, "source": "Banco ANAC 2014", "sourceNumber": 10, "q": "¿Qué altura aproximada se debe tener, volando un planeador, al comenzar el tramo inicial del circuito de aterrizaje?", "options": [{"k": "A", "t": "150 metros."}, {"k": "B", "t": "250 metros."}, {"k": "C", "t": "300 metros."}], "answer": "B", "note": "Banco 2014: B (250 m). El Manual de Instrucción de Vuelo a Vela utiliza aproximadamente 200 m para el comienzo del tramo inicial."}, {"global": 61, "source": "Banco ANAC 2014", "sourceNumber": 11, "q": "¿Qué debemos hacer si durante el remolque el piloto remolcador nos hace señas de corte?", "options": [{"k": "A", "t": "Preguntar por la radio si tiene algún problema."}, {"k": "B", "t": "Cortar inmediatamente."}, {"k": "C", "t": "Observar si estamos en lugar adecuado y luego cortar."}], "answer": "B", "note": ""}, {"global": 62, "source": "Banco ANAC 2014", "sourceNumber": 12, "q": "¿Que es atmósfera ISA?", "options": [{"k": "A", "t": "La que reina en ese momento en el aeródromo."}, {"k": "B", "t": "La que nos da el servicio meteorológico."}, {"k": "C", "t": "Una atmósfera patrón de uso internacional"}], "answer": "C", "note": ""}, {"global": 63, "source": "Banco ANAC 2014", "sourceNumber": 13, "q": "¿Qué es el alargamiento alar?", "options": [{"k": "A", "t": "La distancia entre borde de ataque y borde de fuga."}, {"k": "B", "t": "La distancia entre la raíz y la puntera del ala"}, {"k": "C", "t": "La relación entre envergadura y cuerda alar media."}], "answer": "C", "note": ""}, {"global": 64, "source": "Banco ANAC 2014", "sourceNumber": 14, "q": "¿Qué es gradiente vertical de temperatura?", "options": [{"k": "A", "t": "El aumento gradual de temperatura con la altura."}, {"k": "B", "t": "La diferencia de temperatura de un lugar a otro."}, {"k": "C", "t": "La disminución gradual de la temperatura con la altura."}], "answer": "C", "note": ""}, {"global": 65, "source": "Banco ANAC 2014", "sourceNumber": 15, "q": "¿Qué ocurre con la velocidad de pérdida, al aumentar la inclinación en un viraje?:", "options": [{"k": "A", "t": "Disminuye."}, {"k": "B", "t": "No varía."}, {"k": "C", "t": "Aumenta."}], "answer": "C", "note": ""}, {"global": 66, "source": "Banco ANAC 2014", "sourceNumber": 16, "q": ".- Cual es la anticipación mínima de presentación en vuelo, de un plan VFR controlado que exige retransmisión?", "options": [{"k": "A", "t": "10 minutos"}, {"k": "B", "t": "20 minutos"}, {"k": "C", "t": "30 minutos"}], "answer": "B", "note": ""}, {"global": 67, "source": "Banco ANAC 2014", "sourceNumber": 17, "q": ".- Cuál es la función de la ¨lanita¨?", "options": [{"k": "A", "t": "Verificar la inclinación del viraje."}, {"k": "B", "t": "Mostrar que el planeador está volando coordinado."}, {"k": "C", "t": "Ninguna de las anteriores."}], "answer": "B", "note": ""}, {"global": 68, "source": "Banco ANAC 2014", "sourceNumber": 18, "q": ".- El descenso de temperatura promedio en altura en la tropopausa es de:", "options": [{"k": "A", "t": "2,5° F cada 1000 pies"}, {"k": "B", "t": "2° C cada 300 mts ( 1000 pies)"}, {"k": "C", "t": "2° C cada 1000 mts."}], "answer": "B", "note": "Se conserva la redacción del banco ('tropopausa'). El valor indicado corresponde al gradiente térmico estándar usado en la capa baja de la atmósfera."}, {"global": 69, "source": "Banco ANAC 2014", "sourceNumber": 19, "q": ".- El velocímetro debe ir conectado a:", "options": [{"k": "A", "t": "Termo y toma estática."}, {"k": "B", "t": "Pitot y toma estática."}, {"k": "C", "t": "Ninguna es correcta."}], "answer": "B", "note": ""}, {"global": 70, "source": "Banco ANAC 2014", "sourceNumber": 20, "q": ".- Es posible cursar un plan de vuelo en un aeródromo sin ATS?", "options": [{"k": "A", "t": "Se podría realizar por radio o por teléfono"}, {"k": "B", "t": "No es posible"}, {"k": "C", "t": "Si es posible en cierta categoría de aeródromo"}], "answer": "A", "note": ""}, {"global": 71, "source": "Banco ANAC 2014", "sourceNumber": 21, "q": ".- La elevación de nuestro aeródromo es de 60 mts. y decolamos con ajuste QFE. Si en el primer punto de viraje la elevación es de 200 mts. y el altímetro nos indica 1000mts. Cual será nuestra verdadera altura sobre el mismo?", "options": [{"k": "A", "t": "1040mts."}, {"k": "B", "t": "800mts."}, {"k": "C", "t": "860mts."}], "answer": "C", "note": ""}, {"global": 72, "source": "Banco ANAC 2014", "sourceNumber": 22, "q": "1. Durante el despegue, ¿el planeador debe abandonar el suelo antes que el remolcador?", "options": [{"k": "A", "t": "Siempre."}, {"k": "B", "t": "Es indistinto, mientras evite la corriente de la hélice del remolcador."}, {"k": "C", "t": "Falso"}], "answer": "A", "note": ""}, {"global": 73, "source": "Banco ANAC 2014", "sourceNumber": 23, "q": "1.- La fuente principal generadora de cambios atmosféricos es:", "options": [{"k": "A", "t": "Las mareas."}, {"k": "B", "t": "El Sol."}, {"k": "C", "t": "El calentamiento de la tierra."}], "answer": "B", "note": ""}, {"global": 74, "source": "Banco ANAC 2014", "sourceNumber": 24, "q": "14.- Si una masa de aire se va trasladando estará:", "options": [{"k": "A", "t": "Desarrollando propiedades convectivas."}, {"k": "B", "t": "Tomando propiedades de la superficie por donde transita."}, {"k": "C", "t": "Permaneciendo en su estado original."}], "answer": "B", "note": ""}, {"global": 75, "source": "Banco ANAC 2014", "sourceNumber": 25, "q": "15.- Cuando una masa de aire frio y caliente se encuentran:", "options": [{"k": "A", "t": "El aire frio se posesiona por encima del aire caliente."}, {"k": "B", "t": "El aire caliente se mantiene por debajo del aire frio."}, {"k": "C", "t": "El aire frio se posesiona por debajo del aire caliente."}], "answer": "C", "note": ""}, {"global": 76, "source": "Banco ANAC 2014", "sourceNumber": 26, "q": "16.- Un fenómeno meteorológico que siempre ocurre cuando se vuela través de un frente es un cambio en:", "options": [{"k": "A", "t": "La dirección del viento"}, {"k": "B", "t": "Tipo de precipitación"}, {"k": "C", "t": "La estabilidad de las masas"}], "answer": "A", "note": ""}, {"global": 77, "source": "Banco ANAC 2014", "sourceNumber": 27, "q": "17.- Uno de los cambios fácilmente reconocibles cuando se cruza un frente es:", "options": [{"k": "A", "t": "El cambio en la temperatura."}, {"k": "B", "t": "El incremento de la cobertura nubosa."}, {"k": "C", "t": "El aumento de la humedad relativa."}], "answer": "A", "note": ""}, {"global": 78, "source": "Banco ANAC 2014", "sourceNumber": 28, "q": "18.- Grandes acumulaciones de monóxido de carbono en el cuerpo humano causan:", "options": [{"k": "A", "t": "Rigidez en la frente."}, {"k": "B", "t": "Pérdida de fuerza muscular."}, {"k": "C", "t": "Una sensación aumentada de bienestar."}], "answer": "B", "note": ""}, {"global": 79, "source": "Banco ANAC 2014", "sourceNumber": 29, "q": "19.- ¿Cuál de las siguientes afirmaciones define mejor la hipoxia?", "options": [{"k": "A", "t": "Un estado de deficiencia de oxígeno en el cuerpo."}, {"k": "B", "t": "Un incremento anormal en el volumen de aire respirado."}, {"k": "C", "t": "Una afección por la formación de burbujas de gas alrededor de las articulaciones o músculos."}], "answer": "A", "note": ""}, {"global": 80, "source": "Banco ANAC 2014", "sourceNumber": 30, "q": "20.- Cuando se enfrenta una situación estresante durante el vuelo, un incremento anormal en el volumen de aire inspirado y exhalado puede causar una afección conocida como:", "options": [{"k": "A", "t": "Hiperventilación."}, {"k": "B", "t": "Aerosinusitis."}, {"k": "C", "t": "Aerotitis."}], "answer": "A", "note": ""}, {"global": 81, "source": "Banco ANAC 2014", "sourceNumber": 31, "q": "21.- ¿Cuál de las siguientes causas es la más probable que produzca hiperventilación?", "options": [{"k": "A", "t": "Tensión emocional, ansiedad o miedo."}, {"k": "B", "t": "El consumo excesivo de alcohol."}, {"k": "C", "t": "Un índice extremadamente lento de respiración y oxígeno insuficiente."}], "answer": "A", "note": ""}, {"global": 82, "source": "Banco ANAC 2014", "sourceNumber": 32, "q": "22.- Un piloto debería ser capaz de superar los síntomas de hiperventilación o evitar futuros eventos al:", "options": [{"k": "A", "t": "Controlar en detalle los instrumentos de vuelo para controlar el avión."}, {"k": "B", "t": "Enlentecer el índice de respiración, respirar en una bolsa o hablar en voz alta."}, {"k": "C", "t": "Incrementar el índice de respiración para aumentar la ventilación de los pulmones."}], "answer": "B", "note": "Se conserva la respuesta histórica del banco. La recomendación de respirar en una bolsa no debe tomarse como consejo médico actual."}, {"global": 83, "source": "Banco ANAC 2014", "sourceNumber": 33, "q": "23.- La vulnerabilidad a envenenamiento por monóxido de carbono aumenta a medida que:", "options": [{"k": "A", "t": "La altitud aumenta."}, {"k": "B", "t": "La altitud disminuye."}, {"k": "C", "t": "La presión de aire aumenta."}], "answer": "A", "note": ""}, {"global": 84, "source": "Banco ANAC 2014", "sourceNumber": 34, "q": "25.- Si una masa de aire inestable es forzado a ascender, ¿qué tipo de nubosidad se puede esperar?", "options": [{"k": "A", "t": "Nubes estratiformes de poco desarrollo vertical."}, {"k": "B", "t": "Nubes estratiformes con considerable turbulencia."}, {"k": "C", "t": "Nubes con considerable desarrollo vertical asociado a turbulencia."}], "answer": "C", "note": ""}, {"global": 85, "source": "Banco ANAC 2014", "sourceNumber": 35, "q": "27.- Si un piloto experimenta desorientación espacial durante el vuelo en una condición de visibilidad restringida, la mejor manera de superar el efecto consiste en:", "options": [{"k": "A", "t": "Confiar en las indicaciones de los instrumentos de la aeronave."}, {"k": "B", "t": "Concentrarse en las sensaciones de guiño, cabeceo y balanceo."}, {"k": "C", "t": "Aminorar en forma consciente el ritmo de respiración hasta que los síntomas desaparezcan y se normalice el ritmo normal de respiración."}], "answer": "A", "note": ""}, {"global": 86, "source": "Banco ANAC 2014", "sourceNumber": 36, "q": "29.- ¿Cuál es el antídoto cuando un piloto tiene una actitud riesgosa, como \"impulsividad\"?", "options": [{"k": "A", "t": "Me podría suceder a mí."}, {"k": "B", "t": "Hazlo rápido para terminar con eso."}, {"k": "C", "t": "No tan rápido, piensa primero."}], "answer": "C", "note": ""}, {"global": 87, "source": "Banco ANAC 2014", "sourceNumber": 37, "q": "3.- El viento que se desplaza es creado por:", "options": [{"k": "A", "t": "Movimiento de aire desde áreas de baja presión hacia un área de alta presión."}, {"k": "B", "t": "Movimiento de aire desde áreas de alta presión hacia un área de baja presión."}, {"k": "C", "t": "El efecto que provoca la fuerza de coriolis."}], "answer": "B", "note": ""}, {"global": 88, "source": "Banco ANAC 2014", "sourceNumber": 38, "q": "30.- La intensidad de la turbulencia se puede clasificar como:", "options": [{"k": "A", "t": "Leve, moderada, fuerte, severa."}, {"k": "B", "t": "Inestable."}, {"k": "C", "t": "Estable."}], "answer": "A", "note": ""}, {"global": 89, "source": "Banco ANAC 2014", "sourceNumber": 39, "q": "31.- En el proceso de toma de decisiones aeronáuticas ¿cuál es el primer paso para neutralizar una actitud riesgosa?", "options": [{"k": "A", "t": "Tomar un criterio racional."}, {"k": "B", "t": "Reconocer los pensamientos riesgosos."}, {"k": "C", "t": "Reconocer la invulnerabilidad de la situación."}], "answer": "B", "note": ""}, {"global": 90, "source": "Banco ANAC 2014", "sourceNumber": 40, "q": "32.- El manejo de riesgo, como parte de un proceso de toma de decisiones aeronáuticas, ¿de qué características depende para reducir los riesgos relacionados con cada vuelo?", "options": [{"k": "A", "t": "La aplicación de manejo de estrés y procedimientos de elementos de riesgo."}, {"k": "B", "t": "Consciencia situacional, reconocimiento del problema y buen criterio."}, {"k": "C", "t": "El proceso mental de analizar toda la información en una situación en particular y tomar una decisión oportuna en la elección de una acción."}], "answer": "B", "note": ""}, {"global": 91, "source": "Banco ANAC 2014", "sourceNumber": 41, "q": "35.- ¿Qué es el efecto suelo?", "options": [{"k": "A", "t": "El resultado de la interferencia de la superficie del suelo con el patrón de circulación del aire sobre la aeronave."}, {"k": "B", "t": "El resultado de la alteración del patrón de circulación del aire incrementando la resistencia inducida en el ala del avión."}, {"k": "C", "t": "El resultado de la interrupción del patrón de circulación del aire sobre el ala del avión, al punto de no mantenerlo en vuelo."}], "answer": "A", "note": ""}, {"global": 92, "source": "Banco ANAC 2014", "sourceNumber": 42, "q": "36.- ¿Qué debe esperar el piloto como resultado del efecto suelo?", "options": [{"k": "A", "t": "Se incrementan los vórtices de punta de ala, creando una estela turbulenta que genera problemas a la aeronave despegando o aterrizando."}, {"k": "B", "t": "La resistencia inducida decrece y cualquier exceso de velocidad como consecuencia puede producir un exceso de flotabilidad durante el aterrizaje."}, {"k": "C", "t": "El aterrizaje en pérdida total requerirá menos deflexión del timón de profundidad."}], "answer": "B", "note": ""}, {"global": 93, "source": "Banco ANAC 2014", "sourceNumber": 43, "q": "36.- ¿Quién es responsable de determinar si un piloto se encuentra apto para volar en un vuelo en particular, aún si él/ella cuenta con un psicofísico vigente?", "options": [{"k": "A", "t": "La ANAC."}, {"k": "B", "t": "El médico."}, {"k": "C", "t": "El piloto."}], "answer": "C", "note": ""}, {"global": 94, "source": "Banco ANAC 2014", "sourceNumber": 44, "q": "37.- ¿Cuál es el factor común que afecta los accidentes más prevenibles?", "options": [{"k": "A", "t": "Falla estructural."}, {"k": "B", "t": "Falla mecánica."}, {"k": "C", "t": "Error humano."}], "answer": "C", "note": ""}, {"global": 95, "source": "Banco ANAC 2014", "sourceNumber": 45, "q": "38.- ¿Qué suele causar desorientación espacial o colisión con el suelo u obstáculos cuando se vuela según las Reglas de Vuelo Visual (VFR)?", "options": [{"k": "A", "t": "El vuelo visual que se continúa con condiciones instrumentales, sin estar preparado para ello."}, {"k": "B", "t": "Situarse detrás de la aeronave."}, {"k": "C", "t": "Volar ignorando las sensaciones del cuerpo."}], "answer": "A", "note": ""}, {"global": 96, "source": "Banco ANAC 2014", "sourceNumber": 46, "q": "39.- Se formará niebla si:", "options": [{"k": "A", "t": "La temperatura desciende."}, {"k": "B", "t": "La temperatura aumenta a la del punto de rocío"}, {"k": "C", "t": "La temperatura desciende a la del punto de rocío."}], "answer": "C", "note": ""}, {"global": 97, "source": "Banco ANAC 2014", "sourceNumber": 47, "q": "4.- Los centros de baja presión son áreas a las cuales se las denomina:", "options": [{"k": "A", "t": "Con la letra A."}, {"k": "B", "t": "Ciclónicas o de depresión."}, {"k": "C", "t": "Áreas de subsidencia."}], "answer": "B", "note": ""}, {"global": 98, "source": "Banco ANAC 2014", "sourceNumber": 48, "q": "43.- El método más eficaz para encontrar otra aeronave para evitar colisiones durante el vuelo diurno consiste en utilizar:", "options": [{"k": "A", "t": "Una concentración espaciada regularmente en las posiciones 3, 9 y 12 en punto."}, {"k": "B", "t": "Una serie de movimientos oculares cortos, regularmente espaciados, para buscar en cada sector de 10 grados."}, {"k": "C", "t": "Visión periférica al observar pequeños sectores y utilizar la visión no enfocada en el centro."}], "answer": "B", "note": ""}, {"global": 99, "source": "Banco ANAC 2014", "sourceNumber": 49, "q": "6.- El descenso de temperatura promedio en altura es de", "options": [{"k": "A", "t": "2,5° F cada 1000 pies."}, {"k": "B", "t": "2° C cada 300 metros (1000 pies)."}, {"k": "C", "t": "2° C cada 1000 metros."}], "answer": "B", "note": ""}, {"global": 100, "source": "Banco ANAC 2014", "sourceNumber": 50, "q": "7.- La temperatura estándar a nivel del mar es de:", "options": [{"k": "A", "t": "13° C."}, {"k": "B", "t": "15° C."}, {"k": "C", "t": "15° F."}], "answer": "B", "note": ""}, {"global": 101, "source": "Banco ANAC 2014", "sourceNumber": 51, "q": "8.- ¿En qué condición meteorológica es probable hablar de una inversión de temperatura?", "options": [{"k": "A", "t": "Con nubes de gran desarrollo vertical sobre una altura de inversión."}, {"k": "B", "t": "Buena visibilidad en las capas bajas de la atmósfera y pobre visibilidad sobre la zona de inversión."}, {"k": "C", "t": "Un incremento de la temperatura a medida que aumenta la altitud."}], "answer": "C", "note": ""}, {"global": 102, "source": "Banco ANAC 2014", "sourceNumber": 52, "q": "A mayor ángulo de ataque:", "options": [{"k": "A", "t": "Mayor sustentación y menor resistencia."}, {"k": "B", "t": "Menor sustentación y menor resistencia."}, {"k": "C", "t": "Mayor sustentación y mayor resistencia."}], "answer": "C", "note": ""}, {"global": 103, "source": "Banco ANAC 2014", "sourceNumber": 53, "q": "A mayor presión, la densidad:", "options": [{"k": "A", "t": "No varía."}, {"k": "B", "t": "Aumenta."}, {"k": "C", "t": "Disminuye."}], "answer": "B", "note": ""}, {"global": 104, "source": "Banco ANAC 2014", "sourceNumber": 54, "q": "A medida que el planeador pierde velocidad, ¿qué se debe hacer para mantener la misma sustentación?:", "options": [{"k": "A", "t": "Aumentar la guiñada."}, {"k": "B", "t": "Disminuir el alabeo."}, {"k": "C", "t": "Incrementar el ángulo de ataque"}], "answer": "C", "note": ""}, {"global": 105, "source": "Banco ANAC 2014", "sourceNumber": 55, "q": "Al concretar el desprendimiento del planeador (corte), debo:", "options": [{"k": "A", "t": "Realizar un viraje por izquierda."}, {"k": "B", "t": "Mantener el rumbo establecido (el remolcador realiza un viraje ascendente)."}, {"k": "C", "t": "Realizar un viraje ascendente por derecha."}], "answer": "A", "note": ""}, {"global": 106, "source": "Banco ANAC 2014", "sourceNumber": 56, "q": "Clases de espacios aéreos en Argentina:", "options": [{"k": "A", "t": "Clase A,B y C"}, {"k": "B", "t": "Clase A,B,C y D"}, {"k": "C", "t": "Clase A,B,C,D,F,G"}], "answer": "C", "note": ""}, {"global": 107, "source": "Banco ANAC 2014", "sourceNumber": 57, "q": "Cómo debemos parar la rotación en una pérdida en viraje?", "options": [{"k": "A", "t": "Con alerón contrario."}, {"k": "B", "t": "Con palanca atrás."}, {"k": "C", "t": "Con pedal contrario."}], "answer": "C", "note": ""}, {"global": 108, "source": "Banco ANAC 2014", "sourceNumber": 58, "q": "Como se denomina a la Zona de control de aeródromo?", "options": [{"k": "A", "t": "TMA"}, {"k": "B", "t": "ATZ"}, {"k": "C", "t": "CTR"}], "answer": "C", "note": ""}, {"global": 109, "source": "Banco ANAC 2014", "sourceNumber": 59, "q": "Como se denomina a la Zona de Control Terminal?", "options": [{"k": "A", "t": "TMA"}, {"k": "B", "t": "ATZ"}, {"k": "C", "t": "CTR"}], "answer": "A", "note": ""}, {"global": 110, "source": "Banco ANAC 2014", "sourceNumber": 60, "q": "Como se obtiene el permiso para cambiar e vuelo VFR a VFR Controlado, con la dependencia ATS?", "options": [{"k": "A", "t": "Antes de ingresar al espacio aéreo controlado"}, {"k": "B", "t": "Hasta el momento del despegue, luego de lo cual NO se puede cambiar"}, {"k": "C", "t": "En el momento de ingresar a espacio aéreo controlado VFR/IFR"}], "answer": "A", "note": ""}, {"global": 111, "source": "Banco ANAC 2014", "sourceNumber": 61, "q": "Con falla de radio en un VFR controlado ¿Cómo se aterriza en un AD controlado?", "options": [{"k": "A", "t": "Realizar la “Básica” alabeando los planos"}, {"k": "B", "t": "Bajar y subir el tren de aterrizaje en vuelo circular sobre el aeródromo?"}, {"k": "C", "t": "Efectuar alabeo en tramo “Inicial” y esperar señales luminosas verdes de la TWR?"}], "answer": "C", "note": ""}, {"global": 112, "source": "Banco ANAC 2014", "sourceNumber": 62, "q": "Cuál es la principal función del ala?", "options": [{"k": "A", "t": "Disminuir la resistencia."}, {"k": "B", "t": "Generar sustentación."}, {"k": "C", "t": "Manejar el ángulo de ataque."}], "answer": "B", "note": ""}, {"global": 113, "source": "Banco ANAC 2014", "sourceNumber": 63, "q": "Cual es la visibilidad mínima para efectuar un vuelo VFR especial?", "options": [{"k": "A", "t": "5 Km"}, {"k": "B", "t": "Más de 3000 mts."}, {"k": "C", "t": "2500 mts."}], "answer": "C", "note": ""}, {"global": 114, "source": "Banco ANAC 2014", "sourceNumber": 64, "q": "Cuál posición en el remolque debe ser considerada peligrosa?:", "options": [{"k": "A", "t": "En el chorro de la hélice."}, {"k": "B", "t": "Muy alta."}, {"k": "C", "t": "Muy baja."}], "answer": "B", "note": ""}, {"global": 115, "source": "Banco ANAC 2014", "sourceNumber": 65, "q": "Cuando el altímetro indica 0 m en la pista, ¿Cómo se denomina al reglaje utilizado?:", "options": [{"k": "A", "t": "Nivel de vuelo (FL)."}, {"k": "B", "t": "QFE."}, {"k": "C", "t": "QNH."}], "answer": "B", "note": ""}, {"global": 116, "source": "Banco ANAC 2014", "sourceNumber": 66, "q": "Cuándo se produce una pérdida de sustentación?", "options": [{"k": "A", "t": "Cuando se exceden los 60º de inclinación."}, {"k": "B", "t": "Cuando se excede el ángulo de ataque critico"}, {"k": "C", "t": "Ninguna es correcta."}], "answer": "B", "note": ""}, {"global": 117, "source": "Banco ANAC 2014", "sourceNumber": 67, "q": "Cuanto más inclinado es un viraje, el factor de carga.", "options": [{"k": "A", "t": "Aumenta."}, {"k": "B", "t": "Disminuye."}, {"k": "C", "t": "Permanece igual."}], "answer": "A", "note": ""}, {"global": 118, "source": "Banco ANAC 2014", "sourceNumber": 68, "q": "El ángulo de ataque es:", "options": [{"k": "A", "t": "El ángulo entre el ala y el fuselaje."}, {"k": "B", "t": "El ángulo entre el viento relativo y la cuerda del ala."}, {"k": "C", "t": "El ángulo entre el ala y el elevador."}], "answer": "B", "note": ""}, {"global": 119, "source": "Banco ANAC 2014", "sourceNumber": 69, "q": "El desprendimiento de los filetes de aire de un perfil aerodinámico está en función de:", "options": [{"k": "A", "t": "De la velocidad."}, {"k": "B", "t": "Del ángulo de ataque."}, {"k": "C", "t": "De la relación envergadura – cuerda."}], "answer": "B", "note": ""}, {"global": 120, "source": "Banco ANAC 2014", "sourceNumber": 70, "q": "El peso aparente del planeador es mayor al peso real durante un viraje:", "options": [{"k": "A", "t": "Por efecto de la fuerza centrífuga:"}, {"k": "B", "t": "Por efecto de la fuerza centrípeta."}, {"k": "C", "t": "Ninguna de las anteriores."}], "answer": "A", "note": ""}, {"global": 121, "source": "Banco ANAC 2014", "sourceNumber": 71, "q": "El servicio de información terminal (ATIS) brinda:", "options": [{"k": "A", "t": "Información no esencial para reducir la congestión de transito"}, {"k": "B", "t": "Información meteorológica, de transito en la terminal y pista"}, {"k": "C", "t": "Aviso a los pilotos de probables situaciones de riesgo y peligro"}], "answer": "B", "note": ""}, {"global": 122, "source": "Banco ANAC 2014", "sourceNumber": 72, "q": "El tirabuzón se recupera de la siguiente manera:", "options": [{"k": "A", "t": "Colocar la palanca en neutro, levantar plano con alerón y controlar la velocidad."}, {"k": "B", "t": "Aplicar pedal opuesto al giro hasta que cesa la rotación, aflojando la palanca y recuperar con la menor velocidad posible."}, {"k": "C", "t": "Aplicar pedal opuesto al giro, palanca atrás para sostener la pérdida, nivelar alas con alerones."}], "answer": "B", "note": ""}, {"global": 123, "source": "Banco ANAC 2014", "sourceNumber": 73, "q": "El uso de flaps positivo está asociado a:", "options": [{"k": "A", "t": "Planeo entre térmicas."}, {"k": "B", "t": "Vuelo a altas velocidades."}, {"k": "C", "t": "Vuelo a bajas velocidades."}], "answer": "C", "note": ""}, {"global": 124, "source": "Banco ANAC 2014", "sourceNumber": 74, "q": "El variómetro indica:", "options": [{"k": "A", "t": "Velocidad verdadera. ."}, {"k": "B", "t": "Velocidad vertical."}, {"k": "C", "t": "Aceleración longitudinal"}], "answer": "B", "note": ""}, {"global": 125, "source": "Banco ANAC 2014", "sourceNumber": 75, "q": "El viento que se desplaza es creado por:", "options": [{"k": "A", "t": "movimiento de aire desde áreas de baja presión hacia un área de alta presión"}, {"k": "B", "t": "movimiento de aire desde áreas de alta presión hacia un área de baja presión"}, {"k": "C", "t": "el efecto que provoca la fuerza de Coriolis."}], "answer": "B", "note": ""}, {"global": 126, "source": "Banco ANAC 2014", "sourceNumber": 76, "q": "En que condición meteorológica es probable hablar de una inversión de temperatura?", "options": [{"k": "A", "t": "Con nubes de gran desarrollo vertical sobre una altura de inversión"}, {"k": "B", "t": "Buena visibilidad en capas bajas de la atmosfera y pobre visibilidad sobre la zona de inversión"}, {"k": "C", "t": "Un incremento de la temperatura a medida que aumenta la altitud"}], "answer": "C", "note": ""}, {"global": 127, "source": "Banco ANAC 2014", "sourceNumber": 77, "q": "En radiotelefonía, la palabra internacional de socorro es:", "options": [{"k": "A", "t": "PAN PAN"}, {"k": "B", "t": "S.O.S"}, {"k": "C", "t": "MAYDAY"}], "answer": "C", "note": ""}, {"global": 128, "source": "Banco ANAC 2014", "sourceNumber": 78, "q": "En travesía se puede volar VFR sobre una capa que no cubra mas de:", "options": [{"k": "A", "t": "3/8 de la superficie terrestre"}, {"k": "B", "t": "4/8 de la superficie terrestre"}, {"k": "C", "t": "5/8 de la superficie terrestre"}], "answer": "B", "note": ""}, {"global": 129, "source": "Banco ANAC 2014", "sourceNumber": 79, "q": "En un día sin viento, al realizar la maniobra de vuelo recto y nivelado, manteniendo las alas niveladas no se logra conservar el rumbo. Esto se debe a:", "options": [{"k": "A", "t": "Control ineficiente de alerones."}, {"k": "B", "t": "Control ineficiente de timón de dirección."}, {"k": "C", "t": "“a” y “b” son correctas"}], "answer": "C", "note": ""}, {"global": 130, "source": "Banco ANAC 2014", "sourceNumber": 80, "q": "Es más fácil entrar inadvertidamente en pérdida:", "options": [{"k": "A", "t": "En un viraje escarpado."}, {"k": "B", "t": "En un viraje suave."}, {"k": "C", "t": "ninguna es correcta"}], "answer": "B", "note": "Clave del Banco 2014: B. Esta respuesta presenta una discrepancia con la explicación aerodinámica del Manual sobre virajes escarpados y velocidad de pérdida."}, {"global": 131, "source": "Banco ANAC 2014", "sourceNumber": 81, "q": "Es posible presentar un plan de vuelo durante el vuelo?", "options": [{"k": "A", "t": "Siempre se puede presentar"}, {"k": "B", "t": "Solo si se despegó de un aeródromo sin ATS"}, {"k": "C", "t": "De acuerdo a la categoría de avión y al tipo de vuelo"}], "answer": "B", "note": ""}, {"global": 132, "source": "Banco ANAC 2014", "sourceNumber": 82, "q": "La función de los alerones es:", "options": [{"k": "A", "t": "Rotar el planeador a través del eje vertical"}, {"k": "B", "t": "Controlar la inclinación del ala."}, {"k": "C", "t": "Generar más sustentación"}], "answer": "B", "note": ""}, {"global": 133, "source": "Banco ANAC 2014", "sourceNumber": 83, "q": "La función del ladero (ayudante que sostiene el ala) es mantener los planos nivelados hasta que, al incrementar su velocidad el planeador, sea efectivo el comando de:", "options": [{"k": "A", "t": "Dirección (Timón)"}, {"k": "B", "t": "Alabeo (Alerones)"}, {"k": "C", "t": "Profundidad (Elevador)"}], "answer": "B", "note": ""}, {"global": 134, "source": "Banco ANAC 2014", "sourceNumber": 84, "q": "La función del timón de profundidad es:", "options": [{"k": "A", "t": "Controlar el ángulo de ataque."}, {"k": "B", "t": "Controlar la velocidad."}, {"k": "C", "t": "Ambas son correctas."}], "answer": "C", "note": ""}, {"global": 135, "source": "Banco ANAC 2014", "sourceNumber": 85, "q": "La presión, con la altura:", "options": [{"k": "A", "t": "No varía."}, {"k": "B", "t": "Aumenta."}, {"k": "C", "t": "Disminuye."}], "answer": "C", "note": ""}, {"global": 136, "source": "Banco ANAC 2014", "sourceNumber": 86, "q": "La principal función de los frenos aerodinámicos es:", "options": [{"k": "A", "t": "Incrementar la sustentación."}, {"k": "B", "t": "Disminuir la relación de planeo."}, {"k": "C", "t": "Incrementar la resistencia"}], "answer": "C", "note": ""}, {"global": 137, "source": "Banco ANAC 2014", "sourceNumber": 87, "q": "La responsabilidad de evitar una colisión bajo reglas VFR es de:", "options": [{"k": "A", "t": "El control de área correspondiente"}, {"k": "B", "t": "El control y el piloto"}, {"k": "C", "t": "El piloto"}], "answer": "C", "note": ""}, {"global": 138, "source": "Banco ANAC 2014", "sourceNumber": 88, "q": "La resultante aerodinámica surge de la relación entre:", "options": [{"k": "A", "t": "Sustentación y peso."}, {"k": "B", "t": "Sustentación y resistencia."}, {"k": "C", "t": "Tracción y resistencia."}], "answer": "B", "note": ""}, {"global": 139, "source": "Banco ANAC 2014", "sourceNumber": 89, "q": "Los mínimos meteorológicos VMC de un aeródromo controlado son:", "options": [{"k": "A", "t": "Visibilidad 8 Km y techo 1000 ft."}, {"k": "B", "t": "Visibilidad 5 Km y techo 1000 ft."}, {"k": "C", "t": "Visibilidad 2,5 Km y techo 500 ft."}], "answer": "B", "note": ""}, {"global": 140, "source": "Banco ANAC 2014", "sourceNumber": 90, "q": "Los niveles de vuelo están tomados con referencia a:", "options": [{"k": "A", "t": "Las alturas u obstáculos de un aeródromo"}, {"k": "B", "t": "La elevación del aeródromo"}, {"k": "C", "t": "La presión atmosférica estándar"}], "answer": "C", "note": ""}, {"global": 141, "source": "Banco ANAC 2014", "sourceNumber": 91, "q": "Los números 09 y 27 en una pista indican que su orientación es aproximadamente:", "options": [{"k": "A", "t": "009° y 027° verdadero"}, {"k": "B", "t": "090°y 270° verdadero"}, {"k": "C", "t": "090° y 270° magnético"}], "answer": "C", "note": ""}, {"global": 142, "source": "Banco ANAC 2014", "sourceNumber": 92, "q": "Los virajes Suaves, Normales y Escarpados se realizan con una inclinación de:", "options": [{"k": "A", "t": "30º, 60º y 90º"}, {"k": "B", "t": "20º, 45º y 60º"}, {"k": "C", "t": "15º, 30º y 45º"}], "answer": "B", "note": ""}, {"global": 143, "source": "Banco ANAC 2014", "sourceNumber": 93, "q": "Para convertir los valores de viento informados en nudos a kilómetros por hora, debo:", "options": [{"k": "A", "t": "Multiplicar los valores por tres y restarles el 50 %."}, {"k": "B", "t": "Sumarles el 30 %."}, {"k": "C", "t": "Multiplicar los valores por dos y restarles el 10 %."}], "answer": "C", "note": ""}, {"global": 144, "source": "Banco ANAC 2014", "sourceNumber": 94, "q": "Para qué se usa el flap negativo?", "options": [{"k": "A", "t": "Para mejorar la performance a altas velocidades."}, {"k": "B", "t": "Para subir mejor en la térmica."}, {"k": "C", "t": "Para efectuar la aproximación con más seguridad."}], "answer": "A", "note": ""}, {"global": 145, "source": "Banco ANAC 2014", "sourceNumber": 95, "q": "Para realizar la maniobra de vuelo recto y nivelado se debe controlar los siguientes parámetros:", "options": [{"k": "A", "t": "Velocidad, alas niveladas con el horizonte, rumbo y la bolita del indicador de giro y ladeo (o “lana centrada”)"}, {"k": "B", "t": "Velocidad, variómetro en cero, rumbo y la bolita del indicador de giro y ladeo (o “lana centrada”)"}, {"k": "C", "t": "Velocidad, altímetro sin variaciones, variómetro en cero y la bolita del indicador de giro y ladeo (o “lana centrada”)"}], "answer": "A", "note": ""}, {"global": 146, "source": "Banco ANAC 2014", "sourceNumber": 96, "q": "Que acción debe realizar un piloto que despega desde un aeródromo no controlado antes de entrar en un espacio “C”?", "options": [{"k": "A", "t": "Debe contactarse con el ATC antes de ingresar"}, {"k": "B", "t": "Debe presentar plan de vuelo antes de la partida"}, {"k": "C", "t": "Debe estar a la escucha del ATC antes de ingresar"}], "answer": "A", "note": ""}, {"global": 147, "source": "Banco ANAC 2014", "sourceNumber": 97, "q": "Que áreas de control se encuentran en el espacio aéreo “C”?", "options": [{"k": "A", "t": "Aeródromos controlados"}, {"k": "B", "t": "TMA y CTR"}, {"k": "C", "t": "TMA,CTR y ATZ"}], "answer": "C", "note": ""}, {"global": 148, "source": "Banco ANAC 2014", "sourceNumber": 98, "q": "Que Areas de Control se encuentran en el espacio aéreo Clase A?", "options": [{"k": "A", "t": "Aeródromos controlados"}, {"k": "B", "t": "CTR con uno o más aeródromos"}, {"k": "C", "t": "Aerovias y TMA por encima de FL 195"}], "answer": "C", "note": ""}, {"global": 149, "source": "Banco ANAC 2014", "sourceNumber": 99, "q": "Qué debo hacer ante un corte de soga durante el remolque con menos de 80 m de altura?", "options": [{"k": "A", "t": "Regresar a pista con un viraje hacia el lado del viento."}, {"k": "B", "t": "Incorporarme rápidamente a Inicial para aterrizar con viento de frente."}, {"k": "C", "t": "Aterrizar a mi frente, tratando de evitar los obstáculos."}], "answer": "C", "note": ""}, {"global": 150, "source": "Banco ANAC 2014", "sourceNumber": 100, "q": "Qué distancia vertical se mide cuando se habla de altitud?", "options": [{"k": "A", "t": "Entre la aeronave y la superficie terrestre."}, {"k": "B", "t": "Entre el aeródromo o planeador y el nivel medio del mar."}, {"k": "C", "t": "Entre el aeródromo y la aeronave."}], "answer": "B", "note": ""}, {"global": 151, "source": "Banco ANAC 2014", "sourceNumber": 101, "q": "Qué es el factor de carga?:", "options": [{"k": "A", "t": "El peso de la aeronave dividido por la superficie de sustentación."}, {"k": "B", "t": "La acción de la fuerza de gravedad sobre la aeronave."}, {"k": "C", "t": "Las veces que el planeador es capaz de soportar su propio peso."}], "answer": "A", "note": "Se conserva la clave A del Banco 2014, aunque la definición técnica de factor de carga del Manual no coincide con esta formulación."}, {"global": 152, "source": "Banco ANAC 2014", "sourceNumber": 102, "q": "Que se le facilita al piloto antes de entrar en el circuito de un aeródromo controlado?", "options": [{"k": "A", "t": "Longitud de pista y orientación de la misma"}, {"k": "B", "t": "Elevación y longitud de pista"}, {"k": "C", "t": "Pista en uso e información meteorológica disponible"}], "answer": "C", "note": ""}, {"global": 153, "source": "Banco ANAC 2014", "sourceNumber": 103, "q": "Salvo indicación en contrario, todos los virajes en circuito de aeródromo deben ser:", "options": [{"k": "A", "t": "Por izquierda"}, {"k": "B", "t": "Por derecha."}, {"k": "C", "t": "Es indistinto. Depende del viento."}], "answer": "A", "note": "Clave corregida según la hoja revisada: A (por izquierda)."}, {"global": 154, "source": "Banco ANAC 2014", "sourceNumber": 104, "q": "Si el viento cruzado tiende a acercarlo a pista en Inicial, qué actitud toma en Básica?", "options": [{"k": "A", "t": "Anticipa el viraje de Básica a Final."}, {"k": "B", "t": "Disminuye la velocidad de Básica según la intensidad del mismo."}, {"k": "C", "t": "Retarda el viraje de Básica a Final."}], "answer": "A", "note": ""}, {"global": 155, "source": "Banco ANAC 2014", "sourceNumber": 105, "q": "Si en un viraje se aplica más pedal que alerón:", "options": [{"k": "A", "t": "El planeador derrapa."}, {"k": "B", "t": "El planeador desliza."}, {"k": "C", "t": "Ambas son correctas (a y b)."}], "answer": "A", "note": "Clave corregida según la hoja revisada y el Manual: A (el planeador derrapa)."}, {"global": 156, "source": "Banco ANAC 2014", "sourceNumber": 106, "q": "Si la velocidad que tengo en el circuito de aterrizaje es algo mayor que la establecida, ¿cómo corregir?", "options": [{"k": "A", "t": "Aumentar la actitud (subir la nariz del planeador)."}, {"k": "B", "t": "Extender los frenos aerodinámicos"}, {"k": "C", "t": "Compensar hacia adelante (disminuir la actitud)."}], "answer": "B", "note": ""}, {"global": 157, "source": "Banco ANAC 2014", "sourceNumber": 107, "q": "Siendo el planeador más pesado que el aire, ¿qué es necesario para que vuele?", "options": [{"k": "A", "t": "Una fuerza capaz de oponerse a su propio peso."}, {"k": "B", "t": "Una componente paralela al viento relativo."}, {"k": "C", "t": "Una corriente ascendente"}], "answer": "A", "note": ""}, {"global": 158, "source": "Banco ANAC 2014", "sourceNumber": 108, "q": "Un excesivo aumento de peso en el planeador:", "options": [{"k": "A", "t": "Aumenta la carrera de despegue.Reduce la capacidad de ascenso."}, {"k": "B", "t": "Reduce la capacidad de maniobra.Aumenta la velocidad de pérdida."}, {"k": "C", "t": "Todas las anteriores."}], "answer": "C", "note": ""}, {"global": 159, "source": "Banco ANAC 2014", "sourceNumber": 109, "q": "Un planeador con el CG muy atrás:", "options": [{"k": "A", "t": "Es muy estable y no influye en las condiciones de vuelo"}, {"k": "B", "t": "Es poco estable y difícil de recuperar de barrenas."}, {"k": "C", "t": "Ninguna es correcta."}], "answer": "B", "note": ""}, {"global": 160, "source": "Banco ANAC 2014", "sourceNumber": 110, "q": "Un variómetro de energía total:", "options": [{"k": "A", "t": "No refleja la acción del piloto sobre el elevador."}, {"k": "B", "t": "Sí refleja la acción del piloto sobre el elevador."}, {"k": "C", "t": "Ninguna es correcta."}], "answer": "A", "note": ""}, {"global": 161, "source": "Banco ANAC 2014", "sourceNumber": 111, "q": "Volando recto y nivelado, el correcto control de velocidad se obtiene:", "options": [{"k": "A", "t": "Con la relación borde cabina – horizonte."}, {"k": "B", "t": "Con el velocímetro."}, {"k": "C", "t": "Con ambos parámetros (a y b)."}], "answer": "C", "note": ""}];
let quiz = [], pos = 0, score = 0, answered = false, wrong = [], mode = 'all';

function shuffleArray(a) {
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(m) {
  mode=m;
  if(m==='50') quiz=ALL_QUESTIONS.filter(x=>x.global<=50);
  else if(m==='111') quiz=ALL_QUESTIONS.filter(x=>x.global>50);
  else quiz=[...ALL_QUESTIONS];
  if(document.getElementById('shuffle').checked) quiz=shuffleArray([...quiz]);
  pos=0;score=0;wrong=[];answered=false;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}

function render() {
  answered=false;
  const q=quiz[pos];
  document.getElementById('counter').textContent=`Pregunta ${pos+1} de ${quiz.length}`;
  document.getElementById('scoreTop').textContent=`Aciertos: ${score}`;
  document.getElementById('bar').style.width=`${(pos/quiz.length)*100}%`;
  document.getElementById('badge').textContent=`${q.source} · pregunta ${q.sourceNumber}`;
  document.getElementById('question').textContent=q.q;
  const box=document.getElementById('options'); box.innerHTML='';
  q.options.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="letter">${o.k}</span><span>${escapeHtml(o.t)}</span>`;
    b.onclick=()=>answer(o.k,b);
    box.appendChild(b);
  });
  const fb=document.getElementById('feedback');
  fb.className='feedback'; fb.innerHTML='';
  document.getElementById('nextBtn').classList.add('hidden');
  saveProgress();
}

function answer(letter,btn) {
  if(answered) return;
  answered=true;
  const q=quiz[pos];
  const ok=letter===q.answer;
  if(ok) score++; else wrong.push({q,chosen:letter});
  [...document.querySelectorAll('.opt')].forEach(b=>{
    b.disabled=true;
    const k=b.querySelector('.letter').textContent;
    if(k===q.answer) b.classList.add('correct');
    if(k===letter && !ok) b.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  if(document.getElementById('study').checked) {
    fb.className='feedback '+(ok?'ok':'bad');
    const correct=q.options.find(o=>o.k===q.answer);
    fb.innerHTML=`<strong>${ok?'Correcto':'Incorrecto'}</strong><br>Respuesta: ${q.answer}) ${escapeHtml(correct.t)}`+
      (q.note?`<div class="note"><strong>Nota de estudio:</strong> ${escapeHtml(q.note)}</div>`:'');
  }
  document.getElementById('scoreTop').textContent=`Aciertos: ${score}`;
  const nb=document.getElementById('nextBtn');
  nb.textContent=pos===quiz.length-1?'Ver resultado':'Siguiente';
  nb.classList.remove('hidden');
  saveProgress();
}

function nextQuestion() {
  if(!answered) return;
  if(pos>=quiz.length-1) return finish();
  pos++; render();
}

function finish() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  const pct=Math.round(score*1000/quiz.length)/10;
  document.getElementById('finalScore').textContent=`${score} / ${quiz.length}`;
  document.getElementById('finalText').textContent=`${pct}% de respuestas correctas · ${wrong.length} errores`;
  document.getElementById('bar').style.width='100%';
  const rev=document.getElementById('review'); rev.innerHTML='';
  if(wrong.length) {
    const h=document.createElement('h3'); h.textContent='Preguntas incorrectas'; rev.appendChild(h);
    wrong.forEach(w=>{
      const d=document.createElement('div'); d.className='reviewItem';
      const corr=w.q.options.find(o=>o.k===w.q.answer);
      d.innerHTML=`<strong>${escapeHtml(w.q.q)}</strong><br><span class="small">Tu respuesta: ${w.chosen} · Correcta: ${w.q.answer}) ${escapeHtml(corr.t)}</span>`+
        (w.q.note?`<div class="note">${escapeHtml(w.q.note)}</div>`:'');
      rev.appendChild(d);
    });
  }
  localStorage.removeItem('pplProgress');
}

function repeatWrong() {
  if(!wrong.length) return location.reload();
  quiz=wrong.map(x=>x.q); pos=0;score=0;wrong=[];answered=false;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}

function quitQuiz() {
  if(confirm('¿Salir del intento actual?')) location.reload();
}

function saveProgress() {
  try {
    localStorage.setItem('pplProgress',JSON.stringify({mode,pos,score}));
  } catch(e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
